# Pubblica una versione: al push di un tag v* compila il Setup su Windows e crea la release su GitHub,
# da cui l'app installata scarica l'aggiornamento (Impostazioni › Aggiornamenti).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La release nasce come bozza: electron-builder carica i file in parallelo e, se non la trova, ne crea una per file.
      # Si pubblica solo alla fine, così l'app non vede mai una release a metà.
      - run: gh release create $env:GITHUB_REF_NAME --draft --title $env:GITHUB_REF_NAME --notes "Taccuino $env:GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh release edit $env:GITHUB_REF_NAME --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
